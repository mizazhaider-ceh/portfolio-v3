      /* Pre-paint theme: validate the stored value against light and dark only.
         Missing or invalid means light. On a first visit the OS dark preference
         is used as a hint, then saved, so later visits stay stable. */
      (function () {
        try {
          var k = "portfolio-v2-theme";
          var v = localStorage.getItem(k);
          if (v !== "light" && v !== "dark") {
            v = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            localStorage.setItem(k, v);
          }
          document.documentElement.setAttribute("data-theme", v);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", v === "dark" ? "#191817" : "#F7F3EA");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
